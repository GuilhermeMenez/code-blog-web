name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Restrict default GITHUB_TOKEN permissions to read-only.
# Never use pull_request_target — it grants write perms and was the attack
# vector in the TanStack Mini Shai-Hulud supply chain incident (May 2026).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  security:
    name: Supply chain & audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm run deps:ci

      - name: Supply chain scan
        run: npm run security:scan

      - name: Vulnerability audit
        run: npm run deps:audit:full

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:8080/"
          VITE_ENABLE_MOCKS: "false"
